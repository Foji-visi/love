<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сеннээ эжим</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  #stage {
    position:relative;
    width:100vw; height:100vh;
  }
  canvas {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    display:block;
  }
  #startScreen {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    z-index:10;
    transition:opacity 1.4s ease;
  }
  #startScreen.hidden {
    opacity:0;
    pointer-events:none;
  }
  #startBtn {
    position:relative;
    padding:20px 52px;
    font-size:19px;
    letter-spacing:1px;
    color:#ffe1ec;
    background:rgba(255,45,129,0.06);
    border:1px solid rgba(255,120,170,0.55);
    border-radius:40px;
    cursor:pointer;
    outline:none;
    font-weight:500;
    box-shadow:0 0 18px rgba(255,45,129,0.25), inset 0 0 12px rgba(255,45,129,0.12);
    animation:pulseBtn 2.6s ease-in-out infinite;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  #startBtn:hover {
    transform:scale(1.045);
    background:rgba(255,45,129,0.13);
    box-shadow:0 0 30px rgba(255,45,129,0.45), inset 0 0 16px rgba(255,45,129,0.2);
  }
  @keyframes pulseBtn {
    0%,100% { box-shadow:0 0 18px rgba(255,45,129,0.25), inset 0 0 12px rgba(255,45,129,0.12); }
    50% { box-shadow:0 0 34px rgba(255,45,129,0.5), inset 0 0 18px rgba(255,45,129,0.22); }
  }
</style>
</head>

const audio = document.getElementById('bgAudio');
audio.src = "data:audio/mp3;base64," + audioB64;

// ---------- canvas setup ----------
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildParticles();
}
window.addEventListener('resize', resize);

// ---------- heart geometry ----------
function heartPoint(t) {
  // classic parametric heart curve
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return { x, y: -y };
}

function pointInHeart(x, y) {
  // implicit heart formula (scaled) for interior test
  const v = Math.pow(x*x + y*y - 1, 3) - x*x*Math.pow(y,3);
  return v <= 0;
}

let particles = [];
const PINKS = ['#ff2d81','#ff5fa2','#ff85b3','#ff9ecb','#e6197a'];
const WORDS = ['LOVE YOU','Love You','love you','I LOVE YOU'];

function buildParticles() {
  particles = [];
  const scale = Math.min(W, H) * 0.021;
  const cx = W/2, cy = H/2 - Math.min(W,H)*0.02;

  // outline particles (crisp edge of the heart)
  const outlineCount = 130;
  for (let i=0;i<outlineCount;i++){
    const t = (i/outlineCount) * Math.PI * 2;
    const p = heartPoint(t);
    particles.push(makeParticle(cx + p.x*scale, cy + p.y*scale, i));
  }

  // filled interior particles (rejection sampling within heart shape)
  const fillCount = 190;
  let added = 0, tries = 0;
  while (added < fillCount && tries < fillCount*40) {
    tries++;
    const rx = (Math.random()*2 - 1) * 1.35;
    const ry = (Math.random()*2 - 1) * 1.3;
    if (pointInHeart(rx, ry)) {
      const px = cx + rx * 17.5 * scale * 0.9;
      const py = cy - ry * 17.5 * scale * 0.9;
      particles.push(makeParticle(px, py, outlineCount + added));
      added++;
    }
  }
}

function makeParticle(x, y, idx) {
  return {
    x, y,
    word: WORDS[Math.floor(Math.random()*WORDS.length)],
    size: 10 + Math.random()*8,
    delay: idx * 26 + Math.random()*450,     // ms stagger (slowed down)
    alpha: 0,
    flickerSeed: Math.random()*1000,
    color: PINKS[Math.floor(Math.random()*PINKS.length)]
  };
}

function drawWord(x, y, size, color, alpha, word) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color;
  ctx.shadowBlur = size * 1.1;
  ctx.fillStyle = color;
  ctx.font = `600 ${size}px 'Segoe UI', Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(word, x, y);
  ctx.restore();
}

function drawHeartShape(x, y, size, color, alpha, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color;
  ctx.shadowBlur = size * 1.6;
  ctx.fillStyle = color;
  const s = size / 16;
  ctx.beginPath();
  ctx.moveTo(0, 4*s);
  ctx.bezierCurveTo(0, 2*s, -2*s, 0, -5*s, 0);
  ctx.bezierCurveTo(-9*s, 0, -9*s, 5.5*s, -9*s, 5.5*s);
  ctx.bezierCurveTo(-9*s, 9*s, -5*s, 12.5*s, 0, 16*s);
  ctx.bezierCurveTo(5*s, 12.5*s, 9*s, 9*s, 9*s, 5.5*s);
  ctx.bezierCurveTo(9*s, 5.5*s, 9*s, 0, 5*s, 0);
  ctx.bezierCurveTo(2*s, 0, 0, 2*s, 0, 4*s);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// floating ambient hearts drifting upward (subtle, continuous, small heart shapes)
let ambient = [];
function spawnAmbient() {
  ambient.push({
    x: Math.random()*W,
    y: H + 20,
    size: 6 + Math.random()*10,
    speed: 0.35 + Math.random()*0.6,
    drift: (Math.random()*2 - 1) * 0.4,
    color: PINKS[Math.floor(Math.random()*PINKS.length)],
    alpha: 0.12 + Math.random()*0.3,
    rot: Math.random()*0.6 - 0.3
  });
  if (ambient.length > 40) ambient.shift();
}

let startTime = null;
let running = false;
let lastSpawn = 0;

function loop(now) {
  if (!running) return;
  requestAnimationFrame(loop);
  if (startTime === null) startTime = now;
  const elapsed = now - startTime;

  ctx.clearRect(0,0,W,H);

  // ambient floating hearts (background layer)
  if (now - lastSpawn > 650) { spawnAmbient(); lastSpawn = now; }
  for (let i = ambient.length-1; i>=0; i--) {
    const a = ambient[i];
    a.y -= a.speed;
    a.x += a.drift;
    if (a.y < -20) { ambient.splice(i,1); continue; }
    drawHeartShape(a.x, a.y, a.size, a.color, a.alpha, a.rot);
  }

  // main heart made of words
  for (const p of particles) {
    if (elapsed > p.delay && p.alpha < 255) {
      p.alpha = Math.min(255, p.alpha + 5 + Math.random()*3);   // slower fade-in
    }

    let flick = 1.0;
    if (p.alpha >= 255) {
      flick = 0.72 + 0.28 * Math.sin(elapsed*0.0018 + p.flickerSeed);
    }
    const a = Math.max(0, Math.min(1, (p.alpha/255) * flick));
    if (a > 0.01) {
      drawWord(p.x, p.y, p.size, p.color, a, p.word);
    }
  }
}

function startExperience() {
  const screen = document.getElementById('startScreen');
  screen.classList.add('hidden');
  audio.currentTime = 0;
  audio.play().catch(()=>{});
  running = true;
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', startExperience);

resize();
</script>
